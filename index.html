<!DOCTYPE html>
<html>
<head>
<title>clayvans html test page</title>
<style>
  .flex-container {
    display: flex;
    width: 200px;
    height: 100px;
    background-color: lightblue;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: 1px solid black;
  }

  .popup-overlay {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.4);
    backdrop-filter: blur(5px);
  }

  .popup-window {
    display: none;
    position: fixed;
    z-index: 2;
    left: 50%; 
    top: 50%; 
    transform: translate(-50%, -50%); 
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 400px;
    box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2),0 6px 20px 0 rgba(0,0,0,0.19);
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }

  .popup-content {
    text-align: center;
  }

  #close-button {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: none;
    border: none;
    color: black;
  }
  #close-button:hover,
  #close-button:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="flex-container" id="flexBox">
  Click to Open Popup
</div>

<div id="popup-overlay" class="popup-overlay">
  <div id="popup-window" class="popup-window">
    <span id="close-button" onclick="closePopup()">&times;</span>
    <div class="popup-content">
      <h2>Popup Content</h2>
      <p>This is the content of thepopip window . blurred background.</p>
      <p>This is the cnetre</p>
      <p>You can add more content here.</p>
    </div>
  </div>
</div>

<script>
const flexBox = document.getElementById('flexBox');
const popupOverlay = document.getElementById('popup-overlay');
const popupWindow = document.getElementById('popup-window');

flexBox.onclick = function() {
  popupOverlay.style.display = "block";
  popupWindow.style.display = "block";
}

function closePopup() {
  popupOverlay.style.display = "none";
  popupWindow.style.display = "none";
}


window.onclick = function(event) {
  if (event.target == popupOverlay) {
    closePopup();
  }
}
</script>

</body>
</html>
